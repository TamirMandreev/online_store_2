{% extends 'catalog/base.html' %}

{% block main_menu %}
{% include 'catalog/includes/main_menu.html' %}
{% endblock %}

{% block content %}
<div class="container">
    <h1 class="mb-4">Удалить объект Product</h1>
    <p>Вы уверены, что хотите удалить объект {{ product.name }}?</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'home' %}">Отмена</a>
    </form>
</div>
{% endblock %}
