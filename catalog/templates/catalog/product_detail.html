{% extends 'catalog/base.html' %}

{% block main_menu %}
{% include 'catalog/includes/main_menu.html' %}
{% endblock %}

{% block content %}
    <div class="col-12 row text-center">
        <div class="col-2"></div>
        <div class="col-8">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal"> {{ product.name }}</h4>
                </div>
                <div class="card-body">
                    <img src="{{ product.image.url }}" alt="Фото товара">
                    <h2 class="card-title pricing-card-title">{{ product.price }} руб.</h2>
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <p>{{ product.description }}</p>
                    </ul>

                    {% if request.user == object.owner%}
                    <a class="p-2 btn btn-outline-primary" href="{% url 'product_update' product.pk %}">Изменить</a>
                    <a class="p-2 btn btn-outline-danger" href="{% url 'product_delete' product.pk %}">Удалить</a>
                    {% endif %}

                </div>
            </div>
        </div>
        <div class="col-2"></div>

    </div>
{% endblock %}
